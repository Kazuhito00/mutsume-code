<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mutsume-code demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>mutsume-code</h1>
  <div class="headtools">
    <div id="status" class="status booting">初期化中…</div>
    <nav class="tabs">
      <button data-tab="encode" class="active">生成</button>
      <button data-tab="image">画像から読み取り</button>
      <button data-tab="camera">カメラで読み取り</button>
    </nav>
  </div>
</header>

<p class="sub">六角格子の 2 次元コード。すべてブラウザ内 (Pyodide / WASM) で実行。</p>

<main>
  <!-- 生成 -->
  <section id="encode" class="tab active">
    <div class="controls">
      <label>テキスト<textarea id="enc-text" rows="2">https://example.com/mutsume-code</textarea></label>
      <div class="row">
        <label>ECC
          <select id="enc-ecc">
            <option selected>L</option><option>M</option><option>Q</option><option>H</option>
          </select>
        </label>
        <label>プロファイル
          <select id="enc-profile">
            <option value="auto" selected>auto</option>
            <option>compact</option><option>robust</option><option>micro</option>
          </select>
        </label>
        <label>パレット
          <select id="enc-palette">
            <option selected>mono</option><option>color4</option>
          </select>
        </label>
        <label>セルサイズ <input id="enc-size" type="range" min="8" max="30" value="8"></label>
      </div>
      <label class="check"><input type="checkbox" id="enc-grid"> 白セルの枠線を描く</label>
      <p id="enc-warn" class="warn" hidden></p>
      <button id="enc-run" disabled>生成</button>
    </div>
    <div class="result" hidden>
      <div id="enc-info" class="info"></div>
      <img id="enc-img" alt="生成されたコード" hidden>
      <a id="enc-dl" download="mutsume.png" hidden>PNG をダウンロード</a>
    </div>
  </section>

  <!-- 画像から読み取り -->
  <section id="image" class="tab">
    <div class="controls">
      <label>画像ファイル <input id="img-file" type="file" accept="image/*" disabled></label>
      <p class="hint">またはここに画像をドラッグ＆ドロップ</p>
    </div>
    <div class="result" hidden>
      <div id="img-info" class="info"></div>
      <canvas id="img-canvas"></canvas>
    </div>
  </section>

  <!-- カメラ -->
  <section id="camera" class="tab">
    <div class="controls">
      <div class="btnrow">
        <button id="cam-start" disabled>カメラ開始</button>
        <button id="cam-stop" disabled>停止</button>
        <span id="cam-stat" class="info"></span>
      </div>
    </div>
    <div class="result" hidden>
      <video id="cam-video" playsinline muted hidden></video>
      <canvas id="cam-canvas"></canvas>
    </div>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
