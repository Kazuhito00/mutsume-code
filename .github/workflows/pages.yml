name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    # デモとコアに関わる変更のときだけ再デプロイ
    paths:
      - "web/**"
      - "mutsume/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (web/ + mutsume/)
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp -r mutsume _site/mutsume
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
